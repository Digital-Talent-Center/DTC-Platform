; =============================================================================
; PHP Development Configuration — DTC Platform
; Xdebug enabled, errors visible, no OPcache validation lock
; =============================================================================

[PHP]
; Show errors in development
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; OPcache — enable but validate timestamps for hot-reload
opcache.enable = 1
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Memory & Limits (more relaxed for dev)
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Timezone
date.timezone = Asia/Jakarta

; Xdebug 3 configuration
[xdebug]
xdebug.mode = develop,debug
xdebug.start_with_request = yes
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.log_level = 0
