; =============================================================================
; PHP-FPM Pool Configuration — www (PRODUCTION / Railway)
; Berbeda dari www-dev.conf:
;   - listen = 127.0.0.1:9000 (loopback, Nginx & FPM satu container)
;   - user = laravel (non-root)
; =============================================================================

[www]
user = laravel
group = laravel

; Loopback — Nginx dan PHP-FPM ada di dalam satu container yang sama
listen = 127.0.0.1:9000

; Pass Docker/Railway env vars ke PHP-FPM workers
clear_env = no

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging ke stderr (tampil di Railway log viewer)
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Timeouts
request_terminate_timeout = 120
