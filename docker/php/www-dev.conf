; =============================================================================
; PHP-FPM Pool — DEV
; Menjalankan sebagai user laravel (UID 1000)
; Permissions storage/ dihandle oleh entrypoint.sh
; =============================================================================

[www]
user = laravel
group = laravel

listen = 9000

; CRITICAL: Pass Docker container environment variables to PHP-FPM workers
; Without this, PHP-FPM clears all env vars and Laravel can't read APP_KEY etc.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200

; Log to stderr (visible via docker compose logs)
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

request_terminate_timeout = 300
