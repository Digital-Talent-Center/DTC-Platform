; =============================================================================
; PHP-FPM Pool — DEV (Windows Docker Desktop compatible)
; Runs as ROOT so workers can write to bind-mounted host files (owned root:root)
; This is SAFE for local dev only — production uses user=laravel
; =============================================================================

[www]
; Run as root — required for Windows Docker Desktop bind mounts
; (Windows NTFS bind mounts always present as root:root inside container)
user = root
group = root

; Listen on IPv4 explicitly — bare '9000' binds IPv6-only on Alpine, breaking Nginx
listen = 0.0.0.0:9000

; CRITICAL: Pass Docker container environment variables to PHP-FPM workers
; Without this, PHP-FPM clears all env vars and Laravel can't read APP_KEY etc.
clear_env = no

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 200

; Log to stderr (visible via docker compose logs)
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

request_terminate_timeout = 300
