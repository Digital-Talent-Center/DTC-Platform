; =============================================================================
; PHP-FPM Pool Configuration — www
; =============================================================================

[www]
user = laravel
group = laravel

; Listen on socket (better performance than TCP for same-host comms via Docker network)
listen = 9000

; Pass Docker env vars to PHP-FPM workers (APP_KEY, DB_*, REDIS_*, etc.)
clear_env = no

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Logging
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Timeouts
request_terminate_timeout = 120
