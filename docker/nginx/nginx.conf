user nginx;
worker_processes auto;

# PID di /tmp agar selalu writable tanpa setup direktori tambahan
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Logging ke stdout/stderr (tampil di Railway log viewer)
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Laravel routes — semua fallback ke index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # PHP-FPM via loopback (nginx & fpm dalam satu container)
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            # Absolute hardcoded path — paling reliable, tidak bergantung variabel nginx
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 300;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Larang akses ke file tersembunyi
        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            access_log off;
        }
    }
}
