# =============================================================================
# Nginx Configuration — DTC Platform
# Reverse proxy to PHP-FPM, serves static assets directly
# =============================================================================

server {
    listen 80;
    server_name _;

    # Docker's internal DNS — required for variable-based upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /var/www/html/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide Nginx version
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;
    gzip_min_length 1000;
    gzip_vary on;

    # Client settings
    client_max_body_size 50M;

    # ── Static assets — long cache, no PHP ──────────────────────────────────
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif|mp4|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Laravel Vite hot-reload manifest ────────────────────────────────────
    location = /hot {
        proxy_pass http://vite:5173/hot;
    }

    # ── Vite dev server proxy (development only) ─────────────────────────────
    location /@vite {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /node_modules {
        proxy_pass http://vite:5173;
    }

    location /@fs {
        proxy_pass http://vite:5173;
    }

    # ── Main Laravel router ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM handler ──────────────────────────────────────────────────────
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Use variable + resolver to force dynamic DNS re-resolution.
        # This prevents 502 errors when the app container IP changes after restart.
        set $fpm_host app;
        fastcgi_pass $fpm_host:9000;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # ── Block access to hidden files ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
