# railway.toml — Konfigurasi build & deploy untuk Railway
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Stage 'app' adalah stage terakhir — Railway otomatis memilihnya
# Berisi Nginx + PHP-FPM + Supervisor dalam satu container

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
