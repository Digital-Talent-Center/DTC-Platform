# =============================================================================
# docker-compose.prod.yml — DTC Platform PRODUCTION override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

name: dtc-platform

services:

  # ────────────────────────────────────────────────────────────────────────────
  # PHP-FPM (Production build — no Xdebug, OPcache optimized)
  # ────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app             # Production stage
    image: dtc-platform/app:${IMAGE_TAG:-latest}
    container_name: dtc_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    env_file:
      - .env.production        # Use separate production env file
    volumes:
      # NO bind mount of source code — use image-baked files
      # Mount Firebase credentials via Docker volume (read-only)
      - firebase_credentials:/var/www/html/storage/app/firebase:ro
      # Persist storage (uploads, logs)
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    networks:
      - dtc_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "php-fpm --test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ────────────────────────────────────────────────────────────────────────────
  # Queue worker (Production)
  # ────────────────────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: dtc-platform/app:${IMAGE_TAG:-latest}
    container_name: dtc_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600", "--verbose"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
    volumes:
      - firebase_credentials:/var/www/html/storage/app/firebase:ro
      - app_logs:/var/www/html/storage/logs
    networks:
      - dtc_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ────────────────────────────────────────────────────────────────────────────
  # Nginx (Production — serves pre-built assets, no Vite proxy)
  # ────────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: dtc_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dtc_network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL (Production — no port exposed to host)
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dtc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dtc_platform}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ⚠️ No port exposure in production — DB only accessible within Docker network
    networks:
      - dtc_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-dtc_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Redis (Production — no port exposed to host)
  # ────────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dtc_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # ⚠️ No port exposure in production
    networks:
      - dtc_network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Vite dev server — NOT included in production
  # ────────────────────────────────────────────────────────────────────────────
  vite:
    profiles:
      - dev-only  # This service is excluded from prod (no matching profile activated)

# ─────────────────────────────────────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  firebase_credentials:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  dtc_network:
    driver: bridge
    name: dtc_network
